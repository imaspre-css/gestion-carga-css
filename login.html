<!DOCTYPE html>
<html lang="es">

<title>Acceso — Gestión de Carga CSS</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-box { background: #fff; border: 0.5px solid #e0e0d8; border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; text-align: center; }
.logo { background: #1a1a2e; color: #fff; width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin: 0 auto 1.25rem; }
h1 { font-size: 1.1rem; font-weight: 500; margin-bottom: 0.25rem; }
.subtitle { font-size: 0.82rem; color: #888; margin-bottom: 2rem; }
.btn-microsoft { width: 100%; padding: 0.75rem; background: #0078d4; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.15s; margin-bottom: 1rem; }
.btn-microsoft:hover { background: #106ebe; }
.btn-microsoft:disabled { background: #aaa; cursor: not-allowed; }
.notice { padding: 0.65rem 0.9rem; border-radius: 8px; font-size: 0.8rem; margin-bottom: 1rem; background: #e6f1fb; color: #185fa5; border: 0.5px solid #b5d4f4; display: none; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">📋</div>
  <h1>Gestión de Carga CSS</h1>
  <p class="subtitle">Ingeniería y Prevención de Riesgos S.L.</p>

  <div id="noticeMsg" class="notice"></div>

  <!-- Microsoft login -->
  <button class="btn-microsoft" onclick="loginMicrosoft()" id="btnMicrosoft">
    <svg width="18" height="18" viewBox="0 0 21 21" fill="none">
      <rect x="0" y="0" width="10" height="10" fill="#f25022"/>
      <rect x="11" y="0" width="10" height="10" fill="#7fba00"/>
      <rect x="0" y="11" width="10" height="10" fill="#00a4ef"/>
      <rect x="11" y="11" width="10" height="10" fill="#ffb900"/>
    </svg>
    Entrar con Microsoft 365
  </button>

</div>

<script>
// ── MSAL (OBSOLETO) — se conserva comentado para poder revertir al instante
// si algo fallara con la migración a Supabase Auth. No se ejecuta nada de esto.

// ── SUPABASE AUTH (NUEVO) ──────────────────────────────────────
// Sustituye a MSAL para el botón de "Entrar con Microsoft 365". El MSAL de
// encuesta_semanal.html (envío de correos vía Graph) es independiente y no
// se ve afectado por este cambio.
const supabaseClient = supabase.createClient(
  'https://niwnyoxsesbesotumolm.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pd255b3hzZXNiZXNvdHVtb2xtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzQ4NzAsImV4cCI6MjA5NjA1MDg3MH0.ScugENQtfGYuo5ZZKAuXhqOZLzOvLwEQXlr55XpMT5s'
);

var sesionYaProcesada = false;

async function loginMicrosoft() {
  const btn = document.getElementById('btnMicrosoft');
  btn.disabled = true;
  btn.textContent = 'Conectando...';
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'azure',
    options: {
      scopes: 'email',
      // Conserva ?redirect=xxx (si lo hay) a través de todo el ida y vuelta con Microsoft
      redirectTo: window.location.origin + window.location.pathname + window.location.search
    }
  });
  if (error) {
    btn.disabled = false;
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 21 21" fill="none"><rect x="0" y="0" width="10" height="10" fill="#f25022"/><rect x="11" y="0" width="10" height="10" fill="#7fba00"/><rect x="0" y="11" width="10" height="10" fill="#00a4ef"/><rect x="11" y="11" width="10" height="10" fill="#ffb900"/></svg> Entrar con Microsoft 365';
    showNotice('Error al conectar con Microsoft. Usa el PIN temporal.', 'error');
  }
  // Si no hay error, la página navega fuera de aquí inmediatamente.
}

async function procesarSesionSupabase(session) {
  if (sesionYaProcesada || !session) return;
  sesionYaProcesada = true;

  const email = (session.user.email || '').toLowerCase();
  const nombre = session.user.user_metadata?.full_name || session.user.user_metadata?.name || email;

  localStorage.setItem('css_ms_email', email);
  localStorage.setItem('css_ms_nombre', nombre);

  const rol = await getRolFromSupabase(email);

  if (!rol) {
    showNotice('Tu cuenta no tiene acceso configurado. Contacta con el administrador.', 'error');
    return;
  }

  localStorage.setItem('css_rol', rol.rol);
  localStorage.setItem('css_contratos', JSON.stringify(rol.contratos || []));
  localStorage.setItem('css_admin_total', rol.admin_total ? 'true' : 'false');
  if (rol.rol === 'tecnico') {
    localStorage.setItem('css_tecnico', rol.nombre || nombre);
    window.location.href = 'mis-obras.html';
  } else {
    const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
    window.location.href = redirect;
  }
}

// Si ya hay sesión al cargar (p.ej. justo al volver de Microsoft), procesarla.
supabaseClient.auth.getSession().then(({ data }) => {
  if (data.session) procesarSesionSupabase(data.session);
});
// Y por si el evento llega después de esa primera comprobación.
supabaseClient.auth.onAuthStateChange((_event, session) => {
  if (session) procesarSesionSupabase(session);
});

async function getRolFromSupabase(email) {
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pd255b3hzZXNiZXNvdHVtb2xtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzQ4NzAsImV4cCI6MjA5NjA1MDg3MH0.ScugENQtfGYuo5ZZKAuXhqOZLzOvLwEQXlr55XpMT5s';
  // Usar el token de la sesión real (si existe) en vez de la anon key — necesario
  // para que esta consulta funcione una vez que las políticas RLS de usuarios/
  // tecnicos dejen de aceptar anon sin identidad. Si no hubiera sesión (no debería
  // pasar aquí, pero por seguridad), cae de vuelta a la anon key de siempre.
  let token = ANON_KEY;
  try {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) token = data.session.access_token;
  } catch(e) {}
  const headers = { apikey: ANON_KEY, Authorization: 'Bearer ' + token };
  try {
    const res = await fetch('https://niwnyoxsesbesotumolm.supabase.co/rest/v1/usuarios?email=eq.' + encodeURIComponent(email) + '&activo=eq.true&select=*', { headers });
    const rows = await res.json();
    if (rows && rows.length > 0) return rows[0];

    // No está en usuarios -> puede ser un técnico (entran por Microsoft 365 sin PIN previo)
    const resTec = await fetch('https://niwnyoxsesbesotumolm.supabase.co/rest/v1/tecnicos?email=eq.' + encodeURIComponent(email) + '&activo=eq.true&select=*', { headers });
    const rowsTec = await resTec.json();
    if (rowsTec && rowsTec.length > 0) {
      return { rol: 'tecnico', admin_total: false, contratos: [], nombre: rowsTec[0].nombre, email: rowsTec[0].email };
    }
    return null;
  } catch(e) { return null; }
}

function showNotice(msg, type) {
  const n = document.getElementById('noticeMsg');
  n.textContent = msg;
  n.style.display = 'block';
  if (type === 'error') { n.style.background = '#fcebeb'; n.style.color = '#a32d2d'; n.style.borderColor = '#f7c1c1'; }
}

</script>
</body>
</html>
